# conical_pipeline.ini — PrusaSlicer/SuperSlicer 용 파이프라인 프리셋
#
# 사용:
#   python3 conical_slice.py model.stl \
#     --slicer-cmd "prusa-slicer -g --load profiles/conical_pipeline.ini --dont-arrange -o {gcode} {stl}"
#
# 파이프라인에 '필수'인 설정 3가지 (이유 포함):
#   support_material = 0     : 서포트는 우리 해석식이 판단한다. 변환공간의 45° 자동
#                              서포트는 물리와 다름 (docs/warped_threshold_finding.md)
#   arc_fitting = disabled   : G2/G3 호가 나오면 점 단위 역변환이 불가능해짐
#   (--dont-arrange 플래그)  : 변환된 메시의 XY 좌표를 절대 옮기면 안 됨 (역변환 전제)

# --- 파이프라인 필수 ---
support_material = 0
support_material_auto = 0
arc_fitting = disabled
# 절대 E 강제: 역변환(backtransform)이 절대 E를 전제로 e_prev를 추적하므로,
# 상대 E로 슬라이싱되면 압출 회계가 전부 깨진다.
use_relative_e_distances = 0

# --- 출력 품질/크기 (튜닝 가능) ---
layer_height = 0.3
perimeters = 2
fill_density = 15%
skirts = 1
# 입력 메시 단순화(기본 0=끔; 변환 메시가 무거우면 0.01 시도)
resolution = 0
# G-code 경로 단순화 (역변환 후 매끈함 vs 크기의 균형)
gcode_resolution = 0.0125

# --- 온도 (재료에 맞게 수정) ---
temperature = 210
first_layer_temperature = 215
bed_temperature = 60
